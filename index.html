      const x=verts[i*3], y=verts[i*3+1], z=BASE+(verts[i*3+2]-BASE)*zf;
      const x1=x*caz - y*saz, y1=x*saz + y*caz;
      rx[i]=x1; ry[i]=y1*cel - z*sel; rz[i]=y1*sel + z*cel;
    }
    function proj(i){ return [cxp + rx[i]*scale, cyp - rz[i]*scale, ry[i]]; }
    const items=[];
    for(const q of quads){
      const p=q.idx.map(proj);
      const depth=(p[0][2]+p[1][2]+p[2][2]+p[3][2])/4;
      // normal in view space from first three points (3D rotated coords)
      const A=q.idx[0],B=q.idx[1],C=q.idx[3];
      const ux=rx[B]-rx[A], uy=ry[B]-ry[A], uz=rz[B]-rz[A];
      const vx=rx[C]-rx[A], vy=ry[C]-ry[A], vz=rz[C]-rz[A];
      let nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
      const m=Math.hypot(nx,ny,nz)||1; nx/=m; ny/=m; nz/=m;
      if(nz<0){ nx=-nx; ny=-ny; nz=-nz; }
      let sh=0.42+0.62*Math.max(0, nx*L[0]+ny*L[1]+nz*L[2]);
      items.push({p:p, depth:depth, col:q.col, sh:sh});
    }
    for(const s of skirts){
      const A=s.idx[0],B=s.idx[1];
      const pA=proj(A), pB=proj(B);
      const zA=BASE+(verts[A*3+2]-BASE)*zf, zB=BASE+(verts[B*3+2]-BASE)*zf;
      const p=[[pA[0],pA[1]],[pB[0],pB[1]],[pB[0],pB[1]+zB*scale],[pA[0],pA[1]+zA*scale]];
      items.push({p:p.map(q=>[q[0],q[1],(pA[2]+pB[2])/2]), depth:(pA[2]+pB[2])/2 - 0.001, col:s.col, sh:0.75});
    }
    items.sort((a,b)=>b.depth-a.depth);
    for(const it of items){
      const r=Math.min(255,Math.round(it.col[0]*it.sh)), g=Math.min(255,Math.round(it.col[1]*it.sh)), b=Math.min(255,Math.round(it.col[2]*it.sh));
      ctx.fillStyle='rgb('+r+','+g+','+b+')';
      ctx.beginPath(); ctx.moveTo(it.p[0][0], it.p[0][1]);
      for(let k=1;k<it.p.length;k++) ctx.lineTo(it.p[k][0], it.p[k][1]);
      ctx.closePath(); ctx.fill();
    }
    // north arrow (world +y projected)
    const nx1 = -saz, ny1 = caz; // rotated north vector (x1,y1)
    const nUp = ny1*sel;         // its z2 component -> screen up
    const nScrX = nx1, nScrY = -nUp;
    const al=Math.hypot(nScrX,nScrY)||1, ax0=cw-44, ay0=42, len=20;
    ctx.strokeStyle='#e53e3e'; ctx.fillStyle='#e53e3e'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(ax0 - nScrX/al*len, ay0 - nScrY/al*len); ctx.lineTo(ax0 + nScrX/al*len, ay0 + nScrY/al*len); ctx.stroke();
    ctx.beginPath(); ctx.arc(ax0 + nScrX/al*len, ay0 + nScrY/al*len, 3.4, 0, 7); ctx.fill();
    ctx.font='bold 14px system-ui'; ctx.fillText('N', ax0 + nScrX/al*(len+9)-4, ay0 + nScrY/al*(len+9)+5);
    // pro shop marker
    if(marker){
      const gx=DATA.shop.fx*(W-1), gy=(1-DATA.shop.fy)*(H-1);
      const c0=Math.floor(gx), r0=Math.floor(gy);
      const zi=(Math.min(H-1,r0)*W+Math.min(W-1,c0));
      const x=verts[zi*3], y=verts[zi*3+1], z=BASE+(verts[zi*3+2]-BASE)*zf+1.2;
      const x1=x*caz-y*saz, y1=x*saz+y*caz;
      const sx=cxp+x1*scale, sy=cyp-(y1*sel+z*cel)*scale;
      ctx.fillStyle='#e53e3e'; ctx.beginPath(); ctx.arc(sx,sy,5,0,7); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=1.6; ctx.stroke();
      ctx.fillStyle='#e53e3e'; ctx.font='bold 12px system-ui'; ctx.fillText('Pro shop', sx+8, sy+4);
    }
    if(spin){ az += 0.005; }
    requestAnimationFrame(draw);
  }
  // interaction
  const ptrs=new Map(); let pinchD=0;
  cv.addEventListener('pointerdown', e=>{ ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); cv.setPointerCapture(e.pointerId); cv.style.cursor='grabbing';
    if(ptrs.size===2){ const p=[...ptrs.values()]; pinchD=Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y); } });
  cv.addEventListener('pointermove', e=>{
    if(!ptrs.has(e.pointerId)) return;
    const prev=ptrs.get(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===2){
      const p=[...ptrs.values()]; const d=Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
      if(pinchD>0) zoom=Math.max(0.55, Math.min(3.2, zoom*d/pinchD));
      pinchD=d;
    } else {
      az += (e.clientX-prev.x)*0.008;
      el = Math.max(0.15, Math.min(1.35, el + (e.clientY-prev.y)*0.006));
    }
  });
  function endPtr(e){ ptrs.delete(e.pointerId); if(ptrs.size<2) pinchD=0; if(!ptrs.size) cv.style.cursor='grab'; }
  cv.addEventListener('pointerup', endPtr);
  cv.addEventListener('pointercancel', endPtr);
  cv.addEventListener('wheel', e=>{ e.preventDefault(); zoom=Math.max(0.55, Math.min(3.2, zoom*(e.deltaY<0?1.09:0.92))); }, {passive:false});
  cv.addEventListener('dblclick', ()=>{ az=-0.55; el=0.82; zoom=1.0; });
  requestAnimationFrame(draw);
})();
</script>
